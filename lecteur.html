<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lecteur</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>

    <main class="lecteur">

        <a href="javascript:history.back()" class="retour retour-cache">
    ← Retour
</a>

        <div class="lecteur-principal">

            <!-- PARTIE GAUCHE : LECTEUR -->
            <section class="zone-lecture">

                <div class="disque">
                    <img id="pochette" src="" alt="">
                    <div class="centre-disque"></div>
                </div>

                <div class="informations-lecture">

                    <p id="artiste-actuel" class="artiste-actuel"></p>

                    <h1 id="titre-album"></h1>

<a id="lien-version" class="lien-version"></a>

<div class="titre-morceau-actuel">

    <h2 id="morceau-actuel">
        Préparation de l’écoute…
    </h2>

    <button id="paroles-actuelles" class="paroles-actuelles" title="Afficher les paroles">
        🎤
    </button>

</div>

                </div>

                <div class="progression">

                    <div class="barre-progression">
                        <div id="progression" class="progression-actuelle"></div>
                    </div>

                    <div class="temps">
                        <span id="temps-actuel">0:00</span>
                        <span id="duree-totale">0:00</span>
                    </div>

                </div>

                <audio id="audio"></audio>

                <div class="commandes">

    <button id="precedent" title="Titre précédent">
        ⏮
    </button>

    <button id="lecture-pause" title="Lecture / Pause">
        ▶
    </button>

    <button id="stop" title="Stop">
        ⏹
    </button>

    <button id="suivant" title="Titre suivant">
        ⏭
    </button>

    <button id="aleatoire" title="Lecture aléatoire">
    <svg viewBox="0 0 24 24" class="icone-commande">
        <path d="M3 7h18"/>
        <path d="M17 3l4 4-4 4"/>
        <path d="M3 17h18"/>
        <path d="M17 13l4 4-4 4"/>
    </svg>
</button>

<button id="repetition" title="Répétition désactivée">
    <svg viewBox="0 0 24 24" class="icone-commande">
        <path d="M17 2l4 4-4 4"/>
        <path d="M3 11V9a3 3 0 0 1 3-3h15"/>
        <path d="M7 22l-4-4 4-4"/>
        <path d="M21 13v2a3 3 0 0 1-3 3H3"/>
        <path d="M5 5l14 14" stroke-width="3"/>
    </svg>
</button>

    <button id="partager" title="Partager">

    <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
        class="icone-partager"
    >
        <line x1="8.5" y1="11" x2="15.5" y2="6.8"></line>
        <line x1="8.5" y1="13" x2="15.5" y2="17.2"></line>

        <circle cx="6" cy="12" r="3"></circle>
        <circle cx="18" cy="5" r="3"></circle>
        <circle cx="18" cy="19" r="3"></circle>
    </svg>

</button>

</div>

                <div class="volume">

                    <button id="muet" title="Muet">
                        🔊
                    </button>

                    <input
                        type="range"
                        id="volume"
                        min="0"
                        max="1"
                        step="0.01"
                        value="1"
                    >

                </div>

            </section>


            <!-- PARTIE DROITE : LISTE DES MORCEAUX -->
<aside class="zone-liste">
    <h2>Liste des morceaux</h2>

    <button id="telecharger-album" class="telecharger-album">
        ↓ Télécharger l'album
    </button>

    <a href="#" id="partager-album" class="lien-version">
    Partager l'album
</a>

    <div id="liste-morceaux" class="liste-morceaux"></div>
</aside>

        </div>

    </main>

<div id="fenetre-paroles" class="fenetre-paroles">

    <div class="contenu-paroles">

        <button id="fermer-paroles" class="fermer-paroles">
            ✕
        </button>

        <h2 id="titre-paroles"></h2>

        <div id="texte-paroles"></div>

    </div>

</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/artistes.js"></script>
<script src="js/likes.js"></script>
<script src="js/lecteur.js"></script>

    <script>
if ("serviceWorker" in navigator) {

    let rechargementEnAttente = false;
    let rechargementLance = false;

    const controleurDejaPresent =
        !!navigator.serviceWorker.controller;

    function appliquerMiseAJour() {

        if (!rechargementEnAttente || rechargementLance) {
            return;
        }

        const audio = document.getElementById("audio");

        if (audio && !audio.paused && !audio.ended) {
            return;
        }

        rechargementLance = true;
        window.location.reload();
    }

    navigator.serviceWorker.addEventListener(
        "controllerchange",
        () => {

            if (controleurDejaPresent) {
                rechargementEnAttente = true;
                appliquerMiseAJour();
            }

        }
    );

    window.addEventListener("load", async () => {

        try {

            const registration =
                await navigator.serviceWorker.register("./sw.js", {
                    updateViaCache: "none"
                });

            await registration.update();

        } catch (erreur) {

            console.error(
                "Vérification de mise à jour impossible :",
                erreur
            );

        }

    });

    document.addEventListener("visibilitychange", async () => {

        if (document.visibilityState !== "visible") {
            return;
        }

        try {

            const registration =
                await navigator.serviceWorker.getRegistration();

            if (registration) {
                await registration.update();
            }

        } catch (erreur) {

            console.error(
                "Vérification de mise à jour impossible :",
                erreur
            );

        }

        appliquerMiseAJour();

    });

    const audio = document.getElementById("audio");

    if (audio) {

        audio.addEventListener("pause", appliquerMiseAJour);
        audio.addEventListener("ended", appliquerMiseAJour);

    }

}
</script>

</body>

</html>
